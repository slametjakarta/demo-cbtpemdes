<!DOCTYPE html>
<html lang="id" data-theme="light" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEMO — CBT Perangkat Desa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--card:#fff;--tx:#0F172A;--mut:#64748B;--bd:#E2E8F0;--bd2:#CBD5E1;--pri:#1E3A8A;--pri-h:#17306f;--sec:#0284C7;--amb:#D97706;--amb-bg:#FEF3C7;--amb-bd:#FCD34D;--amb-tx:#92400E;--ok:#15803D;--err:#DC2626;--tint:#EFF6FF;--soft:#F1F4FF;--sh:0 1px 3px rgba(15,23,42,.05);--hf:'Plus Jakarta Sans',system-ui,sans-serif;--bf:'Inter',system-ui,sans-serif}
[data-theme=dark]{--bg:#0B1220;--card:#111A2E;--tx:#E5E9F5;--mut:#94A3B8;--bd:#243049;--bd2:#334463;--pri:#4C6FE0;--pri-h:#3E5ECB;--sec:#38B6F5;--amb:#F59E0B;--amb-bg:#3A2A0B;--amb-bd:#7A5A12;--amb-tx:#FCD34D;--ok:#4ADE80;--err:#F87171;--tint:#16233F;--soft:#16203A;--sh:none}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--tx);font-family:var(--bf);font-size:15px;line-height:1.6;margin:0}
h1,h2,h3,h4,h5,.hf{font-family:var(--hf);font-weight:700;color:var(--tx)}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Consolas,monospace;letter-spacing:.04em}
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--sec);z-index:3000;transform:scaleX(0);transform-origin:left;transition:transform .3s;opacity:0}
#bar.on{opacity:1;transform:scaleX(.85)}
#toasts{position:fixed;top:12px;right:12px;z-index:3100;display:flex;flex-direction:column;gap:8px}
.card-c{background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:var(--sh)}
.card-c.soft{background:var(--soft)}
.btn{border-radius:6px;font-weight:600;font-size:14px}
.btn-pri{background:var(--pri);color:#fff;border:1px solid var(--pri)}.btn-pri:hover{background:var(--pri-h);color:#fff}
.btn-sec{background:var(--card);color:var(--tx);border:1px solid var(--bd2)}.btn-sec:hover{background:var(--soft);color:var(--tx)}
.btn-ok{background:var(--ok);color:#fff;border:1px solid var(--ok)}.btn-ok:hover{filter:brightness(.92);color:#fff}
.btn-err{background:var(--err);color:#fff;border:1px solid var(--err)}.btn-err:hover{filter:brightness(.92);color:#fff}
.btn-amb{background:transparent;color:var(--amb);border:1.5px solid var(--amb)}.btn-amb.on{background:var(--amb-bg)}
.btn-ghost{background:transparent;border:1px solid var(--bd);color:var(--mut)}
.form-control,.form-select{background-color:var(--card);color:var(--tx);border:1px solid var(--bd2);border-radius:8px;min-height:44px}
.form-control:focus,.form-select:focus{border-color:var(--sec);box-shadow:0 0 0 3px rgba(2,132,199,.15);background-color:var(--card);color:var(--tx)}
.form-label{font-size:13px;font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:4px;background:var(--tint);color:var(--sec)}
.badge-pri{display:inline-block;background:var(--pri);color:#fff;font-weight:600;font-size:14px;padding:6px 14px;border-radius:4px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sec)}
.brand{display:flex;align-items:center;gap:12px}
.brand>i{width:42px;height:42px;display:grid;place-items:center;background:var(--pri);color:#fff;border-radius:8px;font-size:20px}
.brand small{display:block;font-size:11px;letter-spacing:.06em;color:var(--mut);font-weight:600;line-height:1.2}
.brand b{font-family:var(--hf);font-size:16px;line-height:1.3}
.login-wrap{max-width:1100px;margin:0 auto;padding:24px 16px}
.hdr-card{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px 20px;margin-bottom:16px}
.login-wrap h1{font-size:28px}
.rule{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.rule i{color:var(--sec);font-size:18px}
.tok-in{font-family:ui-monospace,Consolas,monospace;font-size:20px;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.ex-hdr{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--bd);min-height:64px}
.ex-right{display:flex;align-items:center;gap:12px}
.autosave{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut);background:var(--soft);padding:6px 12px;border-radius:8px}
.autosave i{color:var(--ok);font-size:16px}
.timer{display:flex;gap:10px;align-items:center;background:var(--amb-bg);border:1px solid var(--amb-bd);color:var(--amb-tx);padding:6px 14px;border-radius:8px}
.timer i{font-size:20px}.timer small{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;line-height:1}
.timer b{font-family:var(--hf);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.timer.low{background:#FEE2E2;border-color:#FCA5A5;color:#991B1B}
[data-theme=dark] .timer.low{background:#3B1414;border-color:#7F1D1D;color:#FCA5A5}
.ex-body{padding-top:16px;padding-bottom:40px}
.q-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.fs-ctl{display:flex;gap:2px;background:var(--soft);border-radius:6px;padding:3px}
.fs-ctl button{border:0;background:transparent;color:var(--tx);font-weight:600;padding:2px 10px;border-radius:4px;min-height:32px}
.q-img{max-width:100%;max-height:320px;border:1px solid var(--bd);border-radius:8px;margin-bottom:12px;cursor:zoom-in;display:block}
.q-text{font-size:var(--fs,15px);line-height:1.7;font-weight:500;max-width:840px;margin-bottom:24px}
.opts{display:flex;flex-direction:column;gap:12px;max-width:840px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px 16px;color:var(--tx);font-size:var(--fs,15px);line-height:1.6;box-shadow:var(--sh);transition:border-color .15s}
.opt:hover{border:1.5px solid var(--sec);padding:13.5px 15.5px}
.opt .lt{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--soft);font-weight:700;font-size:14px}
.opt.sel{border:2px solid var(--pri);padding:13px 15px;background:var(--tint)}
.opt.sel .lt{background:var(--pri);color:#fff}
.q-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.q-act .btn{min-height:44px;padding:8px 18px}
.grid-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(min-width:420px){.grid-nav{grid-template-columns:repeat(8,1fr)}}
@media(min-width:992px){.grid-nav{grid-template-columns:repeat(5,1fr)}}
.gn{height:40px;border-radius:4px;border:1px solid var(--bd2);background:var(--card);color:var(--mut);font-weight:500;font-size:12px;font-variant-numeric:tabular-nums}
.gn.a{background:var(--pri);border-color:var(--pri);color:#fff}
.gn.r{background:var(--amb);border-color:var(--amb);color:#fff}
.gn.cur{outline:2px solid var(--sec);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--bd2)}
.prog{height:8px;border-radius:99px;background:var(--bd);overflow:hidden}.prog>div{height:100%;background:var(--pri)}
.avatar{width:56px;height:56px;border-radius:8px;background:var(--pri);color:#fff;display:grid;place-items:center;font-family:var(--hf);font-weight:700;font-size:20px;flex:0 0 56px}
.score{font-family:var(--hf);font-weight:800;font-size:56px;color:var(--pri);line-height:1}
[data-theme=dark] .score{color:var(--tx)}
.donut{--p:0;width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center}
.donut>div{width:96px;height:96px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-weight:700;line-height:1.2}
.stat{background:var(--soft);border-radius:8px;padding:12px 14px}.stat small{display:block;font-size:12px;color:var(--mut)}.stat b{font-family:var(--hf);font-size:20px}
.side{position:fixed;inset:0 auto 0 0;width:248px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 12px;z-index:60;transition:transform .2s}
.nav-i{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;color:var(--tx);padding:10px 14px;border-radius:6px;font-weight:500;margin-bottom:4px;text-align:left}
.nav-i:hover{background:var(--soft)}
.nav-i.act{background:var(--pri);color:#fff}
.main{margin-left:248px;min-height:100vh}
.mtop{display:flex;align-items:center;gap:12px;background:var(--card);border-bottom:1px solid var(--bd);padding:12px 24px;position:sticky;top:0;z-index:40}
.mtop h2{font-size:18px;margin:0}
.pg{padding:20px 24px 40px}
.kpi{padding:16px 18px}.kpi small{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.kpi b{font-family:var(--hf);font-size:32px;color:var(--pri);line-height:1.2;font-variant-numeric:tabular-nums}
[data-theme=dark] .kpi b{color:var(--tx)}
.kpi span{font-size:12px;color:var(--mut)}
.live{display:inline-flex;gap:8px;align-items:center;background:var(--tint);color:var(--sec);font-weight:600;font-size:12px;padding:5px 12px;border-radius:99px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sec);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.25}}
.tbl{width:100%;font-size:14px}
.tbl th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);background:var(--soft);padding:10px 12px;white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--bd);vertical-align:middle}
.tbl tr:hover td{background:var(--soft)}
.st{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px}
.st.Selesai{background:#DCFCE7;color:#166534}.st.Sedang{background:#DBEAFE;color:#1E40AF}.st.Belum{background:var(--bd);color:var(--mut)}
[data-theme=dark] .st.Selesai{background:#14351F;color:#86EFAC}[data-theme=dark] .st.Sedang{background:#172554;color:#93C5FD}
.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--soft);font-weight:700;font-size:13px}
.rank.top{background:var(--pri);color:#fff}
.tw{overflow-x:auto}
.kunci{font-weight:700;color:var(--ok)}
.opt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.opt-row .lt{flex:0 0 28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--soft);font-weight:700;font-size:13px}
.menu-btn{display:none}
.scrim{display:none}
@media(max-width:991px){
 .side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 10px 30px rgba(0,0,0,.3)}
 .side.open~.scrim{display:block;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:55}
 .main{margin-left:0}.menu-btn{display:inline-flex}.mtop{padding:10px 14px}.pg{padding:14px 12px 32px}
 .ex-hdr{padding:8px 12px}.autosave{display:none}.timer b{font-size:18px}
 .login-wrap h1{font-size:22px}.score{font-size:44px}
}
</style>
</head>
<body>
<div id="bar"></div>
<div id="toasts" aria-live="polite"></div>
<div id="app"></div>

<!-- Modal -->
<div class="modal fade" id="mod" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" id="modDlg"><div class="modal-content" style="border-radius:12px"><div class="modal-header"><h5 class="modal-title" id="modT"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" id="modX"></button></div><div class="modal-body" id="modB"></div><div class="modal-footer" id="modF"></div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
'use strict';
/* ============ DEMO BACKEND (simulasi Google Apps Script) ============ */
const DB = {
  settings: { Nama_Ujian:'Ujian Seleksi Perangkat Desa', Nama_Panitia:'Panitia Seleksi Perangkat Desa', Durasi_Menit:90, Jumlah_Soal:5, Passing_Grade:65, Prefix_Token:'CBT-', Ujian_Aktif:'TRUE', Jadwal_Buka:'', Jadwal_Tutup:'' },
  bank: [
    { id:'SOAL-001', k:'Tata Kelola', t:'Siapa yang memimpin penyelenggaraan pemerintahan desa?', o:['Kepala Desa','Camat','Bupati','Ketua BPD',''], b:1, kunci:'A' },
    { id:'SOAL-002', k:'UU Desa', t:'Undang-Undang yang mengatur tentang Desa adalah UU Nomor ...', o:['5 Tahun 2014','6 Tahun 2014','7 Tahun 2014','8 Tahun 2014',''], b:1, kunci:'B' },
    { id:'SOAL-003', k:'Keuangan', t:'Sumber pendapatan asli desa antara lain ...', o:['Hasil usaha desa','Dana alokasi umum','Bantuan provinsi','Pajak pusat',''], b:1, kunci:'A' },
    { id:'SOAL-004', k:'Pemerintahan', t:'Perangkat desa yang bertugas di bidang keuangan adalah ...', o:['Kaur Tata Usaha','Kaur Keuangan','Kasi Pemerintahan','Kadus',''], b:1, kunci:'B' },
    { id:'SOAL-005', k:'BPD', t:'Lembaga yang berfungsi menampung aspirasi masyarakat desa adalah ...', o:['LPM','BPD','PKK','Karang Taruna',''], b:1, kunci:'B' }
  ],
  peserta: [
    { id:'PST-001', nik:'3302150804950010', nama:'Contoh Peserta Satu', alamat:'Desa Contoh', lulusan:'S1', jab:'Kaur Keuangan', email:'peserta1@email.com', token:'CBT-DEMO01', st:'Belum', em:'' },
    { id:'PST-002', nik:'3302150804950011', nama:'Contoh Peserta Dua', alamat:'Desa Contoh', lulusan:'S1', jab:'Sekretaris Desa', email:'peserta2@email.com', token:'CBT-DEMO02', st:'Belum', em:'' }
  ],
  sesi: {},   // { pesertaId: { mulai, akhir, urut[], status } }
  nilai: [],  // { id, benar, salah, kosong, total, nilai, waktu }
  admin: [
    { u:'pengolah', p:'Ganti123!', peran:'pengolah_soal', nama:'Admin Pengolah Soal' },
    { u:'penilai',  p:'Ganti123!', peran:'pelihat_nilai', nama:'Admin Pelihat Nilai' }
  ]
};

/* ============ DEMO API (meniru call() ke server) ============ */
const L = ['A','B','C','D','E'];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const hms = s => pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const $ = (s,r)=>(r||document).querySelector(s);
const $$ = (s,r)=>Array.from((r||document).querySelectorAll(s));
const maskNik = n => n.length>=10 ? n.slice(0,6)+'******'+n.slice(-4) : n;
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

const S = { tok:null, at:null, peran:null, nama:'', page:'', u:null, mon:null, mp:1, pp:1, sp:1, soal:null, peserta:null, pend:null, pall:false };
const T = { poll:null, tick:null, save:null, flush:null };
let busy=0, modal=null;

function clearT(){ Object.keys(T).forEach(k=>{clearInterval(T[k]);clearTimeout(T[k]);T[k]=null;}); }
function toast(msg,type){ const el=document.createElement('div'); el.className='toast align-items-center text-bg-'+(type||'primary')+' border-0'; el.innerHTML='<div class="d-flex"><div class="toast-body">'+esc(msg)+'</div><button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>'; $('#toasts').appendChild(el); el.addEventListener('hidden.bs.toast',()=>el.remove()); new bootstrap.Toast(el,{delay:4500}).show(); }
function bar(d){ busy+=d; $('#bar').classList.toggle('on',busy>0); }
function setTheme(t){ document.documentElement.setAttribute('data-theme',t); document.documentElement.setAttribute('data-bs-theme',t); try{localStorage.setItem('cbt_theme',t);}catch(e){} }
function toggleTheme(){ setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); }
function showModal(title,body,footer,o){ o=o||{}; $('#modT').textContent=title; $('#modB').innerHTML=body; $('#modF').innerHTML=footer||''; $('#modF').style.display=footer?'':'none'; $('#modDlg').className='modal-dialog modal-dialog-centered modal-dialog-scrollable'+(o.size?' modal-'+o.size:''); $('#modX').style.display=o.lock?'none':''; if(!modal) modal=new bootstrap.Modal($('#mod')); modal._config.backdrop=o.lock?'static':true; modal._config.keyboard=!o.lock; modal.show(); }
function hideModal(){ if(modal) modal.hide(); }
function confirmBox(title,html,label,cls,fn){ showModal(title,html,'<button class="btn btn-sec" data-bs-dismiss="modal">Batal</button><button class="btn '+(cls||'btn-pri')+'" id="cfOk">'+label+'</button>'); $('#cfOk').onclick=fn; }
function loadingBtn(b,txt){ b.disabled=true; b.dataset.h=b.innerHTML; b.innerHTML='<span class="spinner-border spinner-border-sm"></span> '+txt; }
function resetBtn(b){ b.disabled=false; if(b.dataset.h) b.innerHTML=b.dataset.h; }

/* Simulasi call() — menggantikan google.script.run */
async function call(fn, args, quiet){
  bar(1);
  await sleep(250 + Math.random()*250); // simulasi latency
  bar(-1);
  try {
    const r = API[fn].apply(null, args||[]);
    if (r && r.success===false && !quiet) toast(r.message,'danger');
    return r || { success:false, message:'Tidak ada respons.' };
  } catch(e){
    if(!quiet) toast(e.message||'Kesalahan server.','danger');
    return { success:false, message:e.message };
  }
}
const ok = (d,m)=>({success:true,data:d,message:m||'OK'});
const fail = m=>({success:false,data:null,message:m});

/* ============ API SIMULASI ============ */
const API = {
  mulaiUjian(tok){
    const p = DB.peserta.find(x=>x.token.toUpperCase()===String(tok||'').trim().toUpperCase());
    if(!p) return fail('Token tidak valid. Periksa kembali token Anda.');
    const st = DB.settings;
    let ses = DB.sesi[p.id];
    if(ses && ses.status==='Selesai') return ok({ selesai:true, hasil:this._hasil(p) });
    if(!ses){
      if(String(st.Ujian_Aktif).toUpperCase()==='FALSE') return fail('Ujian belum dibuka atau sudah dikunci panitia.');
      const bank = DB.bank.slice();
      const ids = shuffle(bank.map(s=>s.id)).slice(0, Math.min(st.Jumlah_Soal, bank.length));
      const mulai = Date.now(), akhir = mulai + st.Durasi_Menit*60000;
      DB.sesi[p.id] = { mulai, akhir, urut:ids, status:'Berjalan', jawaban:{}, ragu:[] };
      p.st = 'Sedang';
      ses = DB.sesi[p.id];
    }
    if(Date.now() > ses.akhir + 3000) return ok({ selesai:true, hasil:this._selesaikan(p) });
    const mp = {}; DB.bank.forEach(s=>mp[s.id]=s);
    return ok({ selesai:false, namaUjian:st.Nama_Ujian, peserta:{ nama:p.nama, nik:maskNik(p.nik), jabatan:p.jab }, soal:ses.urut.map(id=>mp[id]).filter(Boolean), jawaban:ses.jawaban||{}, ragu:ses.ragu||[], sisaMs:ses.akhir-Date.now() });
  },
  simpanJawaban(tok, a, r, flush){
    const p = DB.peserta.find(x=>x.token.toUpperCase()===String(tok||'').trim().toUpperCase());
    const ses = p && DB.sesi[p.id];
    if(!ses) return fail('Sesi tidak ditemukan.');
    if(ses.status==='Selesai') return ok({ selesai:true, hasil:this._hasil(p) });
    if(Date.now() > ses.akhir + 3000) return ok({ selesai:true, hasil:this._selesaikan(p) });
    ses.jawaban = a||{}; ses.ragu = r||[];
    return ok({ sisaMs: ses.akhir-Date.now() });
  },
  akhiriUjian(tok, a, r){
    const p = DB.peserta.find(x=>x.token.toUpperCase()===String(tok||'').trim().toUpperCase());
    if(!p) return fail('Token tidak valid.');
    const ses = DB.sesi[p.id]; if(ses){ ses.jawaban=a||{}; ses.ragu=r||[]; }
    return ok(this._selesaikan(p));
  },
  _selesaikan(p){
    const ses = DB.sesi[p.id]; if(!ses) throw new Error('Sesi tidak ditemukan.');
    if(ses.status==='Selesai') return this._hasil(p);
    const mp = {}; DB.bank.forEach(s=>mp[s.id]=s);
    let benar=0,salah=0,kosong=0,poin=0,total=0;
    ses.urut.forEach(id=>{
      const b = mp[id]?mp[id].b:1; total+=b;
      const j = ses.jawaban[id];
      if(!j) kosong++; else if(String(j).toUpperCase()===mp[id].kunci){ benar++; poin+=b; } else salah++;
    });
    const nilai = total ? Math.round(poin/total*10000)/100 : 0;
    DB.nilai.push({ id:p.id, benar, salah, kosong, total:ses.urut.length, nilai, waktu:new Date() });
    ses.status='Selesai'; p.st='Selesai';
    return this._hasil(p);
  },
  _hasil(p){
    const r = DB.nilai.filter(x=>x.id===p.id).pop();
    if(!r) throw new Error('Hasil belum tersedia.');
    const pg = Number(DB.settings.Passing_Grade)||0;
    return { nama:p.nama, nik:maskNik(p.nik), jabatan:p.jab, benar:r.benar, salah:r.salah, kosong:r.kosong, total:r.total, nilai:r.nilai, lulus:r.nilai>=pg, pg, waktu:r.waktu.toLocaleString('id-ID')+' WIB' };
  },
  loginAdmin(u,pw){
    u=String(u||'').trim().toLowerCase();
    const a = DB.admin.find(x=>x.u===u && x.p===pw);
    if(!a) return fail('Username atau password salah.');
    const t = 'demo_'+Math.random().toString(36).slice(2);
    DB._sess = DB._sess||{}; DB._sess[t] = { u:a.u, n:a.nama, r:a.peran };
    return ok({ token:t, nama:a.nama, peran:a.peran });
  },
  logoutAdmin(t){ if(DB._sess) delete DB._sess[t]; return ok(null); },
  gantiPassword(t,lama,baru){
    const a = DB._sess && DB._sess[t]; if(!a) return fail('SESI_HABIS');
    if(String(baru||'').length<8) return fail('Password baru minimal 8 karakter.');
    const adm = DB.admin.find(x=>x.u===a.u);
    if(adm.p!==lama) return fail('Password lama salah.');
    adm.p = baru; return ok(null,'Password berhasil diganti.');
  },
  _admin(t){ const a = DB._sess && DB._sess[t]; if(!a) throw new Error('SESI_HABIS'); return a; },
  ambilMonitoring(t){
    try{ this._admin(t); }catch(e){ return fail(e.message); }
    const now = Date.now(), pg = Number(DB.settings.Passing_Grade)||0;
    let list = DB.peserta.map(p=>{
      const s = DB.sesi[p.id], n = DB.nilai.filter(x=>x.id===p.id).pop();
      const dj = n ? n.total-n.kosong : (s ? Object.keys(s.jawaban||{}).length : 0);
      const tot = n ? n.total : (s ? s.urut.length : 0);
      return { id:p.id, nama:p.nama, nik:maskNik(p.nik), jab:p.jab, desa:p.alamat, st: n?'Selesai':(s?'Sedang':'Belum'), dj, tot, benar:n?n.benar:null, nilai:n?n.nilai:null, sisa: s&&!n ? Math.max(0,Math.round((s.akhir-now)/60000)) : null };
    });
    const fin = list.filter(x=>x.st==='Selesai').sort((a,b)=>b.nilai-a.nilai); fin.forEach((x,i)=>x.rank=i+1);
    list = fin.concat(list.filter(x=>x.st!=='Selesai'));
    const nl = fin.map(x=>x.nilai), dist=[0,0,0,0,0];
    nl.forEach(v=>dist[v<60?0:v<70?1:v<80?2:v<90?3:4]++);
    const lulus = nl.filter(v=>v>=pg).length, formasi = {};
    list.forEach(x=>{ const f=formasi[x.jab||'-']=formasi[x.jab||'-']||{pel:0,sel:0,lulus:0}; f.pel++; if(x.st==='Selesai'){ f.sel++; if(x.nilai>=pg) f.lulus++; } });
    return ok({ pg, ts:now, list, dist, formasi, namaPanitia:DB.settings.Nama_Panitia, namaUjian:DB.settings.Nama_Ujian,
      kpi:{ total:DB.peserta.length, sedang:list.filter(x=>x.st==='Sedang').length, selesai:fin.length,
        rata: nl.length?Math.round(nl.reduce((a,b)=>a+b,0)/nl.length*100)/100:0,
        max: nl.length?Math.max(...nl):0, min: nl.length?Math.min(...nl):0, lulus, tidak:nl.length-lulus } });
  },
  buatRekapPDF(t,jab){
    try{ this._admin(t); }catch(e){ return fail(e.message); }
    const r = this.ambilMonitoring(t).data, rows = r.list.filter(x=>x.st==='Selesai' && (!jab||x.jab===jab));
    if(!rows.length) return fail('Belum ada peserta selesai untuk difilter.');
    toast('Demo: PDF rekap tidak digenerate di mode demo.','warning');
    return ok({ b64:'', nama:'Rekap_Demo.pdf', url:'#' });
  },
  kirimUlangEmail(t,pid){ try{ this._admin(t); }catch(e){ return fail(e.message); } return ok(null,'Demo: permintaan kirim ulang dicatat.'); },
  ambilPeserta(t){
    try{ this._admin(t); }catch(e){ return fail(e.message); }
    return ok(DB.peserta.map(p=>({ id:p.id, nik:maskNik(p.nik), nama:p.nama, jab:p.jab, desa:p.alamat, email:p.email, token:p.token, st:p.st, em:p.em, mulai:!!DB.sesi[p.id] })));
  },
  imporPeserta(t,rows){
    try{ this._admin(t); }catch(e){ return fail(e.message); }
    let n = DB.peserta.length; const out=[], err=[];
    rows.forEach((r0,i)=>{
      const r = {}; Object.keys(r0).forEach(k=>r[String(k).toLowerCase().replace(/[^a-z0-9]/g,'')]=r0[k]);
      const nik = String(r.nik||'').replace(/\D/g,''), nama = String(r.nama||r.namalengkap||'').trim(), em = String(r.email||'').trim();
      if(!nama||!nik){ err.push('Baris '+(i+2)+': NIK/Nama kosong'); return; }
      if(nik.length!==16){ err.push('Baris '+(i+2)+': NIK harus 16 digit ('+nama+')'); return; }
      if(DB.peserta.some(x=>x.nik===nik)){ err.push('Baris '+(i+2)+': NIK sudah terdaftar'); return; }
      n++;
      const tok = DB.settings.Prefix_Token + Math.random().toString(36).slice(2,8).toUpperCase();
      DB.peserta.push({ id:'PST-'+('000'+n).slice(-3), nik, nama, alamat:r.alamat||'', lulusan:r.lulusan||'', jab:r.jabatan||r.jabatandilamar||'', email:em, token:tok, st:'Belum', em:'' });
      out.push(1);
    });
    return ok({ masuk:out.length, gagal:err.length, galat:err.slice(0,30) }, out.length+' peserta berhasil diimpor.');
  },
  resetToken(t,pid){
    try{ this._admin(t); }catch(e){ return fail(e.message); }
    const p = DB.peserta.find(x=>x.id===pid); if(!p) return fail('Peserta tidak ditemukan.');
    p.token = DB.settings.Prefix_Token + Math.random().toString(36).slice(2,8).toUpperCase();
    return ok({ token:p.token }, 'Token baru diterbitkan.');
  },
  imporSoal(t,rows,commit){
    try{ this._admin(t); }catch(e){ return fail(e.message); }
    if(commit && Object.keys(DB.sesi).length) return fail('Ujian sudah dimulai. Bank soal tidak boleh diganti.');
    const ids=new Set(), valid=[], err=[];
    rows.forEach((r0,i)=>{
      const r={}; Object.keys(r0).forEach(k=>r[String(k).toLowerCase().replace(/[^a-z0-9]/g,'')]=r0[k]);
      const id=String(r.idsoal||'').trim(), teks=String(r.tekssoal||'').trim();
      const op=L.map(x=>String(r['opsi'+x.toLowerCase()]==null?'':r['opsi'+x.toLowerCase()]).trim());
      const k=String(r.kuncijawaban||'').trim().toUpperCase(), b=r.bobot===''||r.bobot==null?1:Number(r.bobot);
      let msg='';
      if(!id||!teks) msg='ID_Soal/Teks_Soal kosong';
      else if(op.filter(Boolean).length<2) msg='Minimal 2 opsi jawaban';
      else if(!/^[A-E]$/.test(k)||!op[L.indexOf(k)]) msg='Kunci_Jawaban kosong / tidak sesuai opsi';
      else if(!(b>0)) msg='Bobot tidak valid';
      if(msg){ err.push({baris:i+2,id,msg}); return; }
      if(ids.has(id)){ err.push({baris:i+2,id,msg:'ID_Soal ganda'}); return; }
      ids.add(id); valid.push({ id, k:r.kategori||'Umum', t:teks, g:'', o:op, b, kunci:k });
    });
    if(!commit) return ok({ valid:valid.length, errors:err.length, detail:err.slice(0,50), bergambar:0 });
    DB.bank = valid;
    return ok({ valid:valid.length, errors:err.length }, valid.length+' soal diterapkan ke bank soal.');
  },
  ambilSoal(t){
    try{ this._admin(t); }catch(e){ return fail(e.message); }
    return ok({ soal:DB.bank.map(r=>({ id:r.id, k:r.k, t:r.t, g:r.g||'', o:r.o, b:r.b, kunci:r.kunci })), terkunci:Object.keys(DB.sesi).length>0 });
  },
  simpanSoal(t,o){
    try{ this._admin(t); }catch(e){ return fail(e.message); }
    if(Object.keys(DB.sesi).length) return fail('Ujian sudah dimulai. Soal tidak boleh diubah.');
    const f = DB.bank.findIndex(x=>x.id===o.id);
    const rec = { id:o.id, k:o.k||'Umum', t:o.t, g:o.g, o:o.o, b:o.b, kunci:o.kunci };
    if(f>=0 && !o.baru) DB.bank[f]=rec;
    else if(f>=0 && o.baru) return fail('ID_Soal sudah digunakan.');
    else DB.bank.push(rec);
    return ok(null,'Soal berhasil disimpan.');
  },
  hapusSoal(t,id){
    try{ this._admin(t); }catch(e){ return fail(e.message); }
    if(Object.keys(DB.sesi).length) return fail('Ujian sudah dimulai. Soal tidak boleh dihapus.');
    DB.bank = DB.bank.filter(x=>x.id!==id);
    return ok(null,'Soal dihapus.');
  },
  ambilPengaturan(t){ try{ this._admin(t); }catch(e){ return fail(e.message); } return ok({...DB.settings}); },
  simpanPengaturan(t,o){
    try{ this._admin(t); }catch(e){ return fail(e.message); }
    if(!(Number(o.Durasi_Menit)>0)||!(Number(o.Jumlah_Soal)>0)) return fail('Durasi dan jumlah soal harus lebih dari 0.');
    Object.keys(DB.settings).forEach(k=>{ if(o[k]!==undefined) DB.settings[k]=o[k]; });
    return ok(null,'Pengaturan disimpan.');
  }
};

  e.preventDefault();

  if(!tok){ toast('Masukkan token ujian Anda.','warning'); return; }

  const r = await call('mulaiUjian',[tok]); resetBtn(b);
  if(!r.success) return;
  S.tok = tok;
  if(r.data.selesai) viewHasil(r.data.hasil); else startUjian(r.data);
}
function startUjian(d){
  clearT();
  S.u = { soal:d.soal, a:d.jawaban||{}, r:new Set(d.ragu||[]), i:0, sisa0:d.sisaMs, t0:performance.now(), ver:0, sv:0, fv:0, p:d.peserta, nama:d.namaUjian, fs:15, ending:false, selesai:false };
  viewUjian();
  T.tick = setInterval(tick,1000);
  T.flush = setInterval(()=>{ if(S.u && S.u.fv!==S.u.ver) simpan(true); },60000);
}

function renderSoal(){
  const u = S.u, q = u.soal[u.i], n = u.soal.length, sel = u.a[q.id], rg = u.r.has(q.id);
  const opts = q.o.map((o,k)=>o==null?'':`<button type="button" class="opt ${sel===L[k]?'sel':''}" onclick="pilih('${L[k]}')"><span class="lt">${L[k]}</span><span>${esc(o)}</span></button>`).join('');

function renderMap(){
  const u = S.u, n = u.soal.length; let a=0, r=0;
  const cells = u.soal.map((q,i)=>{ const an=!!u.a[q.id], rg=u.r.has(q.id); if(an)a++; if(rg)r++; return `<button class="gn ${rg?'r':an?'a':''} ${i===u.i?'cur':''}" onclick="gotoQ(${i})">${pad(i+1)}</button>`; }).join('');
  $('#mapCard').innerHTML = `<div class="d-flex justify-content-between align-items-end mb-2"><h5 class="mb-0 fs-6">Peta Kisi Soal</h5><span class="tnum"><b>${a}</b>/${n} <small class="text-secondary">terjawab</small></span></div>

}
function pilih(l){ const u=S.u, q=u.soal[u.i]; if(u.ending) return; u.a[q.id]=l; markDirty(); renderSoal(); }
function ragu(){ const u=S.u, id=u.soal[u.i].id; if(u.r.has(id)) u.r.delete(id); else u.r.add(id); markDirty(); renderSoal(); }
function nav(d){ const u=S.u; u.i=Math.max(0,Math.min(u.soal.length-1,u.i+d)); if(u.sv!==u.ver){ clearTimeout(T.save); simpan(false); } renderSoal(); window.scrollTo({top:0,behavior:'smooth'}); }
function gotoQ(i){ S.u.i=i; renderSoal(); window.scrollTo({top:0,behavior:'smooth'}); }
function fsz(d){ const u=S.u; u.fs=d===0?15:Math.max(13,Math.min(22,u.fs+d)); renderSoal(); }
function setAuto(txt,okk){ const a=$('#auto'); if(a) a.innerHTML='<i class="bi '+(okk===false?'bi-cloud-slash':'bi-cloud-check')+'" style="color:'+(okk===false?'var(--err)':'var(--ok)')+'"></i><span>'+txt+'</span>'; }
function markDirty(){ const u=S.u; u.ver++; setAuto('Menyimpan...'); clearTimeout(T.save); T.save=setTimeout(()=>simpan(false),2500); }
async function simpan(flush){
  const u=S.u; if(!u||u.selesai||u.ending) return;
  const v=u.ver, r=await call('simpanJawaban',[S.tok,Object.assign({},u.a),Array.from(u.r),!!flush],true);
  if(!S.u||S.u!==u) return;
  if(r.success){
    if(r.data.selesai){ u.selesai=true; clearT(); viewHasil(r.data.hasil||null); return; }
    u.sv=Math.max(u.sv,v); if(flush) u.fv=Math.max(u.fv,v);
    if(r.data.sisaMs!=null){ u.sisa0=r.data.sisaMs; u.t0=performance.now(); }
    setAuto('Tersimpan '+new Date().toLocaleTimeString('id-ID'));
  } else setAuto('Gagal menyimpan',false);
}
function tick(){
  const u=S.u; if(!u) return;
  const ms=u.sisa0-(performance.now()-u.t0), s=Math.max(0,Math.ceil(ms/1000));
  const t=$('#tmr'); if(t) t.textContent=hms(s);
  const tm=$('#timer'); if(tm) tm.classList.toggle('low',s<600);
  if(ms<=0 && !u.ending && !u.selesai){ u.ending=true; showModal('Waktu Ujian Habis','<div class="text-center py-3"><div class="spinner-border mb-3"></div><p class="mb-0">Jawaban Anda dikunci dan sedang dinilai.</p></div>','',{lock:true}); akhiri(true); }
}
function konfirmasiSelesai(){
  const u=S.u, n=u.soal.length, a=u.soal.filter(q=>u.a[q.id]).length, r=u.r.size;
  confirmBox('Selesaikan Ujian?', `<p>Anda telah menjawab <b>${a}</b> dari <b>${n}</b> soal.</p>${n-a?`<div class="alert alert-warning py-2"><b>${n-a}</b> soal belum dijawab.</div>`:''}${r?`<div class="alert alert-warning py-2"><b>${r}</b> soal bertanda ragu-ragu.</div>`:''}<p class="mb-0">Setelah dikumpulkan, jawaban <b>tidak dapat diubah</b>.</p>`, 'Ya, Kumpulkan', 'btn-ok', ()=>{ loadingBtn($('#cfOk'),'Mengumpulkan...'); akhiri(false); });
}
async function akhiri(auto){
  const u=S.u; u.ending=true; clearTimeout(T.save);
  let r={success:false};
  for(let k=0;k<(auto?3:1);k++){ r=await call('akhiriUjian',[S.tok,u.a,Array.from(u.r)],auto); if(r.success) break; if(auto) await sleep(2000); }
  if(r.success){ u.selesai=true; clearT(); hideModal(); viewHasil(r.data); }
  else { u.ending=false; const b=$('#cfOk'); if(b) resetBtn(b); toast('Gagal mengumpulkan. Coba lagi.','danger'); }
}
function viewHasil(h){
  clearT();
  if(!h){ $('#app').innerHTML='<div class="login-wrap"><div class="card-c p-4 text-center"><h3>Ujian Selesai</h3><p>Jawaban Anda telah dikunci.</p><button class="btn btn-pri" onclick="viewLogin()">Kembali</button></div></div>'; return; }
  const pct = h.total?Math.round(h.benar/h.total*100):0;
  $('#app').innerHTML = `

function drawMon(){

  if(sel.options.length!==jabs.length+1){ const c=sel.value; sel.innerHTML='<option value="">Semua Formasi</option>'+jabs.map(j=>`<option>${esc(j)}</option>`).join(''); sel.value=c; }

}
function exportCsv(){
  if(!S.mon) return;
  const rows = [['Rank','Nama','NIK','Formasi','Status','Benar','Nilai']].concat(monFiltered().map(x=>[x.rank||'',x.nama,"'"+x.nik,x.jab,x.st,x.benar==null?'':x.benar,x.nilai==null?'':x.nilai]));
  const csv = '\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='nilai_peserta.csv'; a.click();
}

    '<button class="btn btn-sec" data-bs-dismiss="modal">Batal</button><button class="btn btn-pri" id="fOk"><i class="bi bi-check2-circle"></i> Simpan</button>',{size:'lg'});
  $('#fOk').onclick = async ()=>{
    const k=$('input[name=fKunci]:checked'), o={ baru:!id, id:$('#fId').value.trim(), k:$('#fK').value.trim()||'Umum', b:Number($('#fB').value), t:$('#fT').value.trim(), g:'', o:L.map((l,i)=>$('#fO'+i).value.trim()), kunci:k?k.value:'' };
    const b=$('#fOk'); loadingBtn(b,'Menyimpan...'); const r=await call('simpanSoal',[S.at,o]); resetBtn(b);
    if(r.success){ hideModal(); toast(r.message,'success'); loadSoal(); }
  };
}
function hapusSoalUi(id){
  confirmBox('Hapus Soal',`Hapus soal <b>${esc(id)}</b>?`,'Hapus','btn-err', async ()=>{
    const b=$('#cfOk'); loadingBtn(b,'Menghapus...'); const r=await call('hapusSoal',[S.at,id]); resetBtn(b);
    if(r.success){ hideModal(); toast(r.message,'success'); loadSoal(); }
  });
}

/* PENGATURAN */
async function pgSet(){
  $('#pg').innerHTML = '<div class="text-secondary">Memuat pengaturan...</div>';
  const r=await call('ambilPengaturan',[S.at]); if(!r.success||S.page!=='set') return; const s=r.data;
  const fld = (k,lbl,type,hint)=>`<div class="col-md-6"><label class="form-label" for="s_${k}">${lbl}</label><input id="s_${k}" type="${type||'text'}" class="form-control" value="${esc(s[k])}">${hint?`<small class="text-secondary">${hint}</small>`:''}</div>`;
  $('#pg').innerHTML = `<div class="card-c p-4" style="max-width:860px"><h4 class="mb-3">Pengaturan Ujian</h4><div class="row g-3">
    ${fld('Nama_Ujian','Nama Ujian')}${fld('Nama_Panitia','Nama Panitia')}
    ${fld('Durasi_Menit','Durasi (menit)','number')}${fld('Jumlah_Soal','Jumlah Soal per Peserta','number','Diambil acak dari bank soal')}
    ${fld('Passing_Grade','Ambang Batas Kelulusan','number')}${fld('Prefix_Token','Awalan Token')}
    <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="s_aktif" ${String(s.Ujian_Aktif).toUpperCase()!=='FALSE'?'checked':''}><label class="form-check-label" for="s_aktif">Ujian dibuka</label></div></div>
    <div class="col-12"><button class="btn btn-pri" id="sSave" onclick="simpanSet()"><i class="bi bi-save"></i> Simpan Pengaturan</button></div></div></div>`;
}
async function simpanSet(){
  const o={ Ujian_Aktif:$('#s_aktif').checked?'TRUE':'FALSE' };
  ['Nama_Ujian','Nama_Panitia','Durasi_Menit','Jumlah_Soal','Passing_Grade','Prefix_Token'].forEach(k=>o[k]=$('#s_'+k).value);
  const b=$('#sSave'); loadingBtn(b,'Menyimpan...'); const r=await call('simpanPengaturan',[S.at,o]); resetBtn(b);
  if(r.success) toast(r.message,'success');
}
</script>
